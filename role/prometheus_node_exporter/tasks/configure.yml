# Configure Systemd for Prometheus node-exporter.
- name: Configure Systemd for Prometheus node-exporter
  ansible.builtin.template:
    src: systemd.conf.j2
    dest: "{{systemd_lib_dir}}/system/prometheus-node-exporter.service"
    owner: root
    group: root
    mode: 0600
    backup: false
  vars:
    systemd_lib_dir: "{{system.systemd.lib_dir}}"
  notify:
    - Reload Systemd service
    - Restart Prometheus node-exporter service
  tags:
    - configure

# Enable Prometheus node-exporter service at boot.
- name: Enable Prometheus node-exporter service at boot
  ansible.builtin.systemd:
    name: prometheus-node-exporter.service
    enabled: true
  tags:
    - configure
