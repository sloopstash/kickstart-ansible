# Configure Kubelet.
- name: Configure Kubelet
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/kubelet
    regexp: "^KUBELET_EXTRA_ARGS="
    line: "KUBELET_EXTRA_ARGS=--node-ip={{node_ip_address}}"
    state: present
  vars:
    node_ip_address: "{{ansible_eth1.ipv4.address if system.network.host.interface == 'eth1' else ansible_default_ipv4.address}}"
  notify:
    - Restart Kubelet service
  tags:
    - configure

# Initialize Kubernetes cluster.
- name: Initialize Kubernetes cluster
  ansible.builtin.command:
    cmd: "kubeadm init --pod-network-cidr={{pod_network_cidr}} --apiserver-advertise-address={{node_ip_address}} --cri-socket=unix:///var/run/cri-dockerd.sock"
    creates: "{{admin_conf_path}}"
  run_once: true
  when:
    - inventory_hostname in groups['kubernetes_master']
    - "'-mtr-' in inventory_hostname"
    - inventory_hostname | regex_search('-1$')
  vars:
    node_ip_address: "{{ansible_eth1.ipv4.address if system.network.host.interface == 'eth1' else ansible_default_ipv4.address}}"
    pod_network_cidr: "{{kubernetes.cni.calico.pod_network_cidr if kubernetes.cni.driver == 'calico' else kubernetes.cni.flannel.pod_network_cidr}}"
    admin_conf_path: "{{kubernetes.conf_dir}}/admin.conf"
  tags:
    - configure

# Configure Kubernetes client with admin user credentials.
- name: Configure Kubernetes client with admin user credentials
  ansible.builtin.copy:
    src: "{{admin_conf_path}}"
    dest: "{{client_conf_path}}"
    owner: "{{system_user}}"
    group: "{{system_group}}"
    mode: 0600
    backup: false
    remote_src: true
  run_once: true
  when:
    - inventory_hostname in groups['kubernetes_master']
    - "'-mtr-' in inventory_hostname"
    - inventory_hostname | regex_search('-1$')
  vars:
    system_user: "{{system.user}}"
    system_group: "{{system.group}}"
    admin_conf_path: "{{kubernetes.conf_dir}}/admin.conf"
    client_conf_path: "/home/{{system_user}}/.kube/config"
  tags:
    - configure

# Deploy CNI network driver in Kubernetes cluster.
- name: Deploy CNI network driver in Kubernetes cluster
  ansible.builtin.command:
    cmd: "kubectl apply -f {{cni_template_url}}"
  become: true
  become_user: "{{system_user}}"
  run_once: true
  when:
    - inventory_hostname in groups['kubernetes_master']
    - "'-mtr-' in inventory_hostname"
    - inventory_hostname | regex_search('-1$')
  vars:
    system_user: "{{system.user}}"
    cni_template_url: "{{kubernetes.cni.calico.template_url if kubernetes.cni.driver == 'calico' else kubernetes.cni.flannel.template_url}}"
  tags:
    - configure

# Create bootstrap token in Kubernetes cluster.
- name: Create bootstrap token in Kubernetes cluster
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  run_once: true
  when:
    - inventory_hostname in groups['kubernetes_master']
    - "'-mtr-' in inventory_hostname"
    - inventory_hostname | regex_search('-1$')
  register: node_join_command
  tags:
    - configure

# Add temp node to Ansible inventory.
- name: Add temp node to Ansible inventory
  ansible.builtin.add_host:
    name: temp-node
    kubernetes_node_join_command: "{{node_join_command}}"
  tags:
    - configure

# Join Kubernetes worker node to the cluster.
- name: Join Kubernetes worker node to the cluster
  ansible.builtin.command:
    cmd: "{{hostvars['temp-node'].kubernetes_node_join_command.stdout}} --cri-socket=unix:///var/run/cri-dockerd.sock"
    creates: "{{conf_dir}}/kubelet.conf"
  when: inventory_hostname in groups['kubernetes_worker']
  vars:
    conf_dir: "{{kubernetes.conf_dir}}"
  tags:
    - configure
