# Configure Systemd for cAdvisor.
- name: Configure Systemd for cAdvisor
  ansible.builtin.template:
    src: systemd.conf.j2
    dest: "{{systemd_lib_dir}}/system/cadvisor.service"
    owner: root
    group: root
    mode: 0600
    backup: false
  vars:
    systemd_lib_dir: "{{system.systemd.lib_dir}}"
  notify:
    - Reload Systemd service
    - Restart cAdvisor service
  tags:
    - configure

# Enable cAdvisor service at boot.
- name: Enable cAdvisor service at boot
  ansible.builtin.systemd:
    name: cadvisor.service
    enabled: true
  tags:
    - configure
